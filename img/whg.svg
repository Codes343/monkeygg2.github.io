<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <rect width="320" height="200" fill="#fff"/>
  <!-- maze walls --><rect x="0" y="0" width="320" height="20" fill="#1a1a1a"/>
  <rect x="0" y="180" width="320" height="20" fill="#1a1a1a"/>
  <rect x="0" y="0" width="20" height="200" fill="#1a1a1a"/>
  <rect x="300" y="0" width="20" height="200" fill="#1a1a1a"/>
  <!-- inner walls --><rect x="60" y="20" width="20" height="80" fill="#1a1a1a"/>
  <rect x="120" y="60" width="80" height="20" fill="#1a1a1a"/>
  <rect x="200" y="20" width="20" height="60" fill="#1a1a1a"/>
  <rect x="60" y="120" width="120" height="20" fill="#1a1a1a"/>
  <rect x="240" y="100" width="60" height="20" fill="#1a1a1a"/>
  <rect x="140" y="140" width="20" height="40" fill="#1a1a1a"/>
  <!-- start zone (green) --><rect x="22" y="22" width="36" height="36" fill="#00cc44" opacity=".7"/>
  <text x="40" y="44" text-anchor="middle" font-family="Arial" font-size="9" fill="white" font-weight="bold">START</text>
  <!-- end zone (green) --><rect x="262" y="142" width="36" height="36" fill="#00cc44" opacity=".7"/>
  <text x="280" y="164" text-anchor="middle" font-family="Arial" font-size="8" fill="white" font-weight="bold">END</text>
  <!-- yellow coins --><circle cx="100" cy="110" r="5" fill="#ffd700"/><circle cx="180" cy="80" r="5" fill="#ffd700"/><circle cx="260" cy="50" r="5" fill="#ffd700"/>
  <!-- red enemy circles --><circle cx="150" cy="100" r="8" fill="#ff2222"/><circle cx="220" cy="140" r="8" fill="#ff2222"/><circle cx="90" cy="50" r="8" fill="#ff2222"/>
  <!-- player (red square) --><rect x="30" y="80" width="16" height="16" fill="#ff2222" stroke="#cc0000" stroke-width="1"/>
  <!-- death counter --><rect x="90" y="8" width="140" height="18" rx="3" fill="#1a1a1a"/>
  <text x="160" y="21" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff2222">DEATHS: 142</text>
  <!-- title --><text x="160" y="195" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="9" font-weight="900" fill="#1a1a1a">WORLD'S HARDEST GAME</text>
</svg>