<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <rect width="320" height="200" fill="#87CEEB"/>
  <!-- sky --><rect x="0" y="0" width="320" height="110" fill="#87CEEB"/>
  <!-- clouds --><rect x="40" y="20" width="60" height="20" rx="5" fill="white" opacity=".9"/>
  <rect x="50" y="12" width="40" height="20" rx="5" fill="white" opacity=".9"/>
  <rect x="200" y="30" width="50" height="18" rx="4" fill="white" opacity=".8"/>
  <!-- sun --><rect x="270" y="15" width="25" height="25" fill="#ffd700"/>
  <!-- ground layers --><rect x="0" y="110" width="320" height="25" fill="#567d46"/><!-- grass -->
  <rect x="0" y="135" width="320" height="15" fill="#8B6914"/><!-- dirt top
  <rect x="0" y="150" width="320" height="50" fill="#8B6914"/>
  <!-- stone underground --><rect x="0" y="160" width="320" height="40" fill="#888"/>
  <!-- blocks (pixel grid) --><rect x="20" y="90" width="25" height="25" fill="#567d46" stroke="#456933" stroke-width="1"/>
  <rect x="45" y="90" width="25" height="25" fill="#567d46" stroke="#456933" stroke-width="1"/>
  <rect x="70" y="90" width="25" height="25" fill="#567d46" stroke="#456933" stroke-width="1"/>
  <rect x="200" y="85" width="25" height="25" fill="#567d46" stroke="#456933" stroke-width="1"/>
  <rect x="225" y="85" width="25" height="25" fill="#567d46" stroke="#456933" stroke-width="1"/>
  <rect x="200" y="60" width="25" height="25" fill="#8B6914" stroke="#6b4f10" stroke-width="1"/>
  <rect x="200" y="35" width="25" height="25" fill="#567d46" stroke="#456933" stroke-width="1"/>
  <!-- tree --><rect x="100" y="55" width="10" height="55" fill="#8B4513"/>
  <rect x="80" y="35" width="50" height="40" fill="#228B22"/>
  <rect x="85" y="25" width="40" height="25" fill="#228B22"/>
  <rect x="90" y="15" width="30" height="20" fill="#228B22"/>
  <!-- player (steve pixel) --><rect x="145" y="82" width="16" height="14" fill="#f5cba7"/><!-- head -->
  <rect x="143" y="96" width="20" height="20" fill="#1565C0"/><!-- body -->
  <rect x="139" y="96" width="8" height="18" fill="#1565C0"/><!-- left arm -->
  <rect x="159" y="96" width="8" height="18" fill="#1565C0"/><!-- right arm (holding pickaxe) -->
  <rect x="143" y="116" width="8" height="16" fill="#795548"/><!-- left leg -->
  <rect x="155" y="116" width="8" height="16" fill="#795548"/><!-- right leg -->
  <!-- pickaxe --><line x1="167" y1="96" x2="180" y2="80" stroke="#888" stroke-width="2.5"/>
  <rect x="174" y="74" width="12" height="7" fill="#888"/>
  <!-- title --><text x="160" y="195" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="13" font-weight="900" fill="#567d46" stroke="#000" stroke-width="2" paint-order="stroke">MINECRAFT CLASSIC</text>
</svg>