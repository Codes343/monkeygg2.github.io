<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <rect width="320" height="200" fill="#000010"/>
  <!-- stars --><circle cx="20" cy="15" r="1" fill="white"/><circle cx="60" cy="8" r="1.2" fill="white"/><circle cx="100" cy="20" r="1" fill="white"/><circle cx="150" cy="5" r="1.5" fill="white"/><circle cx="200" cy="12" r="1" fill="white"/><circle cx="250" cy="18" r="1.2" fill="white"/><circle cx="290" cy="6" r="1" fill="white"/><circle cx="310" cy="25" r="1" fill="white"/>
  <!-- tunnel (perspective) --><polygon points="160,100 80,190 240,190" fill="none" stroke="#333" stroke-width="1" opacity=".5"/>
  <polygon points="160,100 60,160 260,160" fill="none" stroke="#555" stroke-width="1" opacity=".5"/>
  <!-- tunnel floor pieces --><rect x="30" y="170" width="60" height="25" fill="#555" stroke="#666" stroke-width="1"/>
  <rect x="100" y="158" width="50" height="28" fill="#555" stroke="#666" stroke-width="1"/>
  <rect x="160" y="165" width="55" height="25" fill="#555" stroke="#666" stroke-width="1"/>
  <rect x="225" y="155" width="65" height="30" fill="#555" stroke="#666" stroke-width="1"/>
  <!-- holes (black gaps) --><rect x="92" y="170" width="6" height="25" fill="#000"/><rect x="153" y="162" width="5" height="28" fill="#000"/><rect x="218" y="158" width="5" height="30" fill="#000"/>
  <!-- runner character --><circle cx="155" cy="150" r="8" fill="#7c4dff"/>
  <rect x="150" y="158" width="10" height="13" rx="2" fill="#5a35cc"/>
  <line x1="155" y1="171" x2="148" y2="182" stroke="#5a35cc" stroke-width="2.5"/>
  <line x1="155" y1="171" x2="162" y2="178" stroke="#5a35cc" stroke-width="2.5"/>
  <!-- arm --><line x1="150" y1="161" x2="140" y2="167" stroke="#5a35cc" stroke-width="2.5"/>
  <!-- gravity arrows (sideways running) --><text x="240" y="105" font-family="Arial" font-size="20" fill="#00e5ff" opacity=".6">↻</text>
  <!-- title --><text x="160" y="30" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="22" font-weight="900" fill="#7c4dff">RUN 3</text>
  <text x="160" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#aaa">ENDLESS SPACE RUNNER</text>
</svg>