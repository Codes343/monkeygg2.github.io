<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <rect width="320" height="200" fill="#1a4a1a"/>
  <!-- field lines --><line x1="0" y1="50" x2="320" y2="50" stroke="white" stroke-width=".8" opacity=".4"/>
  <line x1="0" y1="100" x2="320" y2="100" stroke="white" stroke-width=".8" opacity=".4"/>
  <line x1="0" y1="150" x2="320" y2="150" stroke="white" stroke-width=".8" opacity=".4"/>
  <line x1="80" y1="0" x2="80" y2="200" stroke="white" stroke-width=".5" opacity=".3"/>
  <line x1="160" y1="0" x2="160" y2="200" stroke="white" stroke-width=".8" opacity=".5"/>
  <line x1="240" y1="0" x2="240" y2="200" stroke="white" stroke-width=".5" opacity=".3"/>
  <!-- end zones --><rect x="0" y="0" width="40" height="200" fill="#2a6a2a"/>
  <rect x="280" y="0" width="40" height="200" fill="#2a6a2a"/>
  <!-- pixel players --><rect x="130" y="88" width="12" height="16" rx="2" fill="#e74c3c"/><rect x="131" y="84" width="10" height="8" rx="5" fill="#f5cba7"/>
  <rect x="150" y="88" width="12" height="16" rx="2" fill="#e74c3c"/><rect x="151" y="84" width="10" height="8" rx="5" fill="#f5cba7"/>
  <rect x="170" y="88" width="12" height="16" rx="2" fill="#3498db"/><rect x="171" y="84" width="10" height="8" rx="5" fill="#f5cba7"/>
  <rect x="115" y="92" width="12" height="16" rx="2" fill="#3498db"/>
  <!-- football --><ellipse cx="200" cy="75" rx="10" ry="7" fill="#8B4513"/>
  <ellipse cx="200" cy="75" rx="10" ry="7" fill="none" stroke="white" stroke-width="1.5"/>
  <line x1="195" y1="72" x2="205" y2="78" stroke="white" stroke-width="1"/>
  <!-- arc pass line --><path d="M155 88 Q175 50 200 75" fill="none" stroke="white" stroke-width="1.5" stroke-dasharray="4,3" opacity=".8"/>
  <!-- scoreboard --><rect x="90" y="8" width="140" height="35" rx="4" fill="#000" opacity=".8"/>
  <text x="160" y="24" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffd600">RETRO BOWL</text>
  <text x="130" y="37" text-anchor="middle" font-family="monospace" font-size="10" fill="white">HOME 14</text>
  <text x="190" y="37" text-anchor="middle" font-family="monospace" font-size="10" fill="white">AWAY 7</text>
  <!-- pixel art style overlay --><rect width="320" height="200" fill="none" stroke="#3a8a3a" stroke-width="4"/>
</svg>