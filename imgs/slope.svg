<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#050510"/><stop offset="100%" stop-color="#0a0a20"/></linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a2a4a"/><stop offset="100%" stop-color="#05152a"/></linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <!-- grid lines --><line x1="0" y1="50" x2="320" y2="50" stroke="#00e5ff" stroke-width=".3" opacity=".2"/>
  <line x1="0" y1="100" x2="320" y2="100" stroke="#00e5ff" stroke-width=".3" opacity=".2"/>
  <line x1="0" y1="150" x2="320" y2="150" stroke="#00e5ff" stroke-width=".3" opacity=".2"/>
  <line x1="80" y1="0" x2="80" y2="200" stroke="#00e5ff" stroke-width=".3" opacity=".2"/>
  <line x1="160" y1="0" x2="160" y2="200" stroke="#00e5ff" stroke-width=".3" opacity=".2"/>
  <line x1="240" y1="0" x2="240" y2="200" stroke="#00e5ff" stroke-width=".3" opacity=".2"/>
  <!-- slope track --><polygon points="0,80 320,160 320,200 0,200" fill="url(#track)" stroke="#00e5ff" stroke-width="1.5"/>
  <polygon points="40,80 280,160 320,160 320,80 280,80 40,55" fill="#0d1a3a" opacity=".5"/>
  <!-- edge glow --><line x1="0" y1="80" x2="320" y2="160" stroke="#00e5ff" stroke-width="2" opacity=".8"/>
  <line x1="0" y1="200" x2="320" y2="200" stroke="#00e5ff" stroke-width="1" opacity=".4"/>
  <!-- obstacles (red blocks) --><rect x="180" y="128" width="28" height="20" fill="#ff3d3d" rx="2"/>
  <rect x="240" y="140" width="28" height="20" fill="#ff3d3d" rx="2" opacity=".7"/>
  <rect x="80" y="108" width="28" height="20" fill="#ff3d3d" rx="2" opacity=".6"/>
  <!-- ball --><circle cx="130" cy="112" r="12" fill="#00ff88"/>
  <circle cx="130" cy="112" r="12" fill="none" stroke="white" stroke-width="2" opacity=".3"/>
  <ellipse cx="126" cy="108" rx="4" ry="3" fill="white" opacity=".3"/>
  <!-- speed trail --><ellipse cx="100" cy="114" rx="22" ry="6" fill="#00ff88" opacity=".15"/>
  <ellipse cx="72" cy="116" rx="14" ry="4" fill="#00ff88" opacity=".08"/>
  <!-- title --><text x="160" y="38" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="28" font-weight="900" fill="#00e5ff" letter-spacing="4">SLOPE</text>
  <text x="160" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#7ecfff">ENDLESS RUNNER</text>
</svg>