<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <rect width="320" height="200" fill="#f0f7f0"/>
  <!-- Bill face silhouette --><circle cx="80" cy="80" r="45" fill="#fde0a0" stroke="#ddd" stroke-width="1"/>
  <ellipse cx="80" cy="60" rx="28" ry="20" fill="#c8a060"/><!-- hair -->
  <circle cx="70" cy="75" r="4" fill="#444"/><circle cx="90" cy="75" r="4" fill="#444"/><!-- eyes -->
  <!-- glasses --><rect x="60" y="70" width="18" height="12" rx="6" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="82" y="70" width="18" height="12" rx="6" fill="none" stroke="#333" stroke-width="1.5"/>
  <line x1="78" y1="76" x2="82" y2="76" stroke="#333" stroke-width="1.5"/>
  <path d="M73,85 Q80,90 87,85" fill="none" stroke="#333" stroke-width="1.5"/><!-- smile -->
  <!-- dollar amount --><text x="200" y="50" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="22" font-weight="900" fill="#2e7d32">$100B</text>
  <text x="200" y="68" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">TO SPEND</text>
  <!-- item icons (stuff to buy) --><rect x="135" y="85" width="50" height="35" rx="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
  <text x="160" y="108" text-anchor="middle" font-family="Arial" font-size="22">🍔</text>
  <rect x="195" y="85" width="50" height="35" rx="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
  <text x="220" y="108" text-anchor="middle" font-family="Arial" font-size="22">🚀</text>
  <rect x="255" y="85" width="55" height="35" rx="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
  <text x="282" y="108" text-anchor="middle" font-family="Arial" font-size="22">🏝️</text>
  <!-- price tags --><text x="160" y="132" text-anchor="middle" font-family="monospace" font-size="9" fill="#555">$5</text>
  <text x="220" y="132" text-anchor="middle" font-family="monospace" font-size="9" fill="#555">$62M</text>
  <text x="282" y="132" text-anchor="middle" font-family="monospace" font-size="8" fill="#555">$84M</text>
  <!-- budget bar --><text x="160" y="160" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">SPENT: $1.2B / $100B</text>
  <rect x="50" y="165" width="220" height="12" rx="6" fill="#e0e0e0"/>
  <rect x="50" y="165" width="3" height="12" rx="6" fill="#4caf50"/>
  <!-- title --><text x="160" y="192" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="12" font-weight="900" fill="#2e7d32">SPEND BILL GATES' MONEY</text>
</svg>