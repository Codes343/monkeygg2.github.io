<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <rect width="320" height="200" fill="#1a1a2e"/>
  <!-- phone mockup --><rect x="80" y="10" width="160" height="180" rx="20" fill="#0f0f1a" stroke="#333" stroke-width="2"/>
  <rect x="88" y="25" width="144" height="150" rx="5" fill="#16213e"/>
  <!-- phone notch --><rect x="125" y="12" width="70" height="12" rx="6" fill="#0f0f1a"/>
  <!-- life stats --><text x="160" y="50" text-anchor="middle" font-family="Arial" font-size="11" fill="#00e5ff" font-weight="bold">AGE: 23</text>
  <!-- stat bars --><text x="95" y="68" font-family="Arial" font-size="8" fill="#aaa">HAPPY</text>
  <rect x="95" y="72" width="90" height="6" rx="3" fill="#333"/><rect x="95" y="72" width="72" height="6" rx="3" fill="#00e676"/>
  <text x="95" y="88" font-family="Arial" font-size="8" fill="#aaa">HEALTH</text>
  <rect x="95" y="92" width="90" height="6" rx="3" fill="#333"/><rect x="95" y="92" width="55" height="6" rx="3" fill="#ff5252"/>
  <text x="95" y="108" font-family="Arial" font-size="8" fill="#aaa">SMART</text>
  <rect x="95" y="112" width="90" height="6" rx="3" fill="#333"/><rect x="95" y="112" width="80" height="6" rx="3" fill="#7c4dff"/>
  <text x="95" y="128" font-family="Arial" font-size="8" fill="#aaa">LOOKS</text>
  <rect x="95" y="132" width="90" height="6" rx="3" fill="#333"/><rect x="95" y="132" width="45" height="6" rx="3" fill="#ffd600"/>
  <!-- choice buttons --><rect x="92" y="148" width="64" height="18" rx="9" fill="#00e676"/>
  <text x="124" y="161" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="white">GO TO COLLEGE</text>
  <rect x="164" y="148" width="64" height="18" rx="9" fill="#ff5252"/>
  <text x="196" y="161" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="white">DROP OUT</text>
  <!-- title above phone --><text x="160" y="12" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="9" fill="white" opacity=".0">.</text>
  <text x="50" y="105" font-family="Arial Black,sans-serif" font-size="18" font-weight="900" fill="#00e5ff" transform="rotate(-90,50,105)">BITLIFE</text>
  <text x="270" y="105" font-family="Arial Black,sans-serif" font-size="18" font-weight="900" fill="#00e5ff" transform="rotate(90,270,105)">BITLIFE</text>
</svg>