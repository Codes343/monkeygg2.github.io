<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a3a5c"/><stop offset="100%" stop-color="#0d1f33"/></linearGradient></defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <!-- stars --><circle cx="40" cy="20" r="1" fill="white" opacity=".8"/><circle cx="120" cy="15" r="1.2" fill="white" opacity=".9"/><circle cx="200" cy="25" r="1" fill="white"/><circle cx="270" cy="10" r="1.5" fill="white" opacity=".7"/><circle cx="300" cy="30" r="1" fill="white"/>
  <!-- track surface --><polygon points="0,140 320,110 320,200 0,200" fill="#2d5a3d"/>
  <polygon points="0,140 320,110 320,125 0,155" fill="#3a7a52"/>
  <!-- track road --><polygon points="30,148 290,118 295,132 35,162" fill="#555"/><polygon points="30,148 290,118 291,122 31,152" fill="#666"/>
  <!-- lane markings --><rect x="80" y="133" width="20" height="3" fill="white" opacity=".6" transform="rotate(-3 80 133)"/>
  <rect x="140" y="128" width="20" height="3" fill="white" opacity=".6" transform="rotate(-3 140 128)"/>
  <rect x="200" y="123" width="20" height="3" fill="white" opacity=".6" transform="rotate(-3 200 123)"/>
  <!-- car --><rect x="148" y="126" width="24" height="12" rx="3" fill="#e74c3c"/>
  <rect x="152" y="122" width="16" height="7" rx="2" fill="#c0392b"/>
  <circle cx="153" cy="139" r="4" fill="#222"/><circle cx="153" cy="139" r="2" fill="#555"/>
  <circle cx="169" cy="139" r="4" fill="#222"/><circle cx="169" cy="139" r="2" fill="#555"/>
  <!-- speed lines --><line x1="100" y1="132" x2="140" y2="132" stroke="#00e5ff" stroke-width="1.5" opacity=".6"/>
  <line x1="105" y1="136" x2="140" y2="136" stroke="#00e5ff" stroke-width="1" opacity=".4"/>
